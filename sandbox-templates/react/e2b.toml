# This is a config for E2B sandbox template.
# You can use template ID (ctiqcu4tgjmvxa0gt64t) or template name (vibe-reactjs-test) to create a sandbox:

# Python SDK
# from e2b import Sandbox, AsyncSandbox
# sandbox = Sandbox.create("vibe-reactjs-test") # Sync sandbox
# sandbox = await AsyncSandbox.create("vibe-reactjs-test") # Async sandbox

# JS SDK
# import { Sandbox } from 'e2b'
# const sandbox = await Sandbox.create('vibe-reactjs-test')

# WARNING: `e2b template create` (CLI v2) does NOT read this file. It auto-detects
# the Dockerfile and otherwise uses its own defaults — notably memory_mb 1024, and
# no start/ready command at all. Building without the flags below silently halves
# the sandbox RAM and skips the dev-server warmup. The values here are kept as the
# record of what the template is built with; pass them explicitly:
#
#   e2b template create vibe-reactjs-test -p sandbox-templates/react \
#     -d e2b.Dockerfile \
#     -c "/compile_page.sh" \
#     --ready-cmd "until curl -fs -o /dev/null http://localhost:3000; do sleep 1; done" \
#     --cpu-count 2 --memory-mb 2048
#
# Run it from the repo root. `-p` is resolved relative to the current directory,
# so cd'ing into this folder while keeping "-p sandbox-templates/react" makes the
# CLI look for sandbox-templates/react/sandbox-templates/react and fail with
# "No ./e2b.Dockerfile found in the root directory". From in here, drop -p.
#
# In Git Bash, prefix the command with MSYS_NO_PATHCONV=1. Without it MSYS rewrites
# the "/compile_page.sh" argument into "C:/Program Files/Git/compile_page.sh" and the
# build fails with exit 127. PowerShell needs no prefix.

team_id = "3872014a-465d-4936-9ece-e90d528d3b4c"
memory_mb = 2_048
cpu_count = 2
dockerfile = "e2b.Dockerfile"
template_name = "vibe-reactjs-test"
template_id = "ctiqcu4tgjmvxa0gt64t"

start_cmd = "/compile_page.sh"

# The v2 CLI requires a ready command whenever a start command is set, and
# defaults to a blind `sleep 20` if one is missing. Polling the dev server
# instead means the build only succeeds once Vite is actually serving.
ready_cmd = "until curl -fs -o /dev/null http://localhost:3000; do sleep 1; done"
